spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: Intern_Hiring_Backend
  mail:
    host: ${SMTP_HOST:${EMAIL_HOST:}}
    port: ${SMTP_PORT:${EMAIL_PORT:587}}
    username: ${SMTP_USERNAME:${EMAIL_USERNAME:}}
    password: ${SMTP_PASSWORD:${EMAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      # WARNING: Use 'validate' or 'none' in production. Use Flyway/Liquibase for migrations.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.internhiring.backend: INFO

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-origin-patterns: ${CORS_ORIGIN_PATTERNS:https://*.onrender.com,https://*.vercel.app,https://*.netlify.app}

# Admin seed account
admin:
  email: ${ADMIN_EMAIL:admin@intern_hiring.com}
  password: ${ADMIN_PASSWORD:123456789}

# Supabase Configuration
supabase:
  project-ref: ${SUPABASE_PROJECT_ID:hpcftizswcxosgcjoegt}
  anon-key: ${SUPABASE_ANON}
  service-role-key: ${SUPABASE_SERVICE_ROLE}
  jwks-uri: https://${SUPABASE_PROJECT_ID:hpcftizswcxosgcjoegt}.supabase.co/auth/v1/jwt/jwks

email:
  notifications:
    enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
    from: ${EMAIL_FROM:no-reply@intern-hiring.local}
    edge-url: ${SUPABASE_EDGE_EMAIL_URL:}
    edge-secret: ${SUPABASE_EDGE_EMAIL_SECRET:}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:InternHiring <onboarding@resend.dev>}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
